<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <!-- Outer seal ring with dots -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#4c1d95" stroke-width="2" opacity="0.4"/>
  <!-- Dotted seal dots -->
  <g fill="#a78bfa" opacity="0.7">
    <circle cx="256" cy="30" r="5"/>
    <circle cx="308" cy="38" r="4"/>
    <circle cx="356" cy="62" r="4"/>
    <circle cx="395" cy="97" r="4"/>
    <circle cx="422" cy="141" r="4"/>
    <circle cx="436" cy="190" r="4"/>
    <circle cx="436" cy="256" r="5"/>
    <circle cx="436" cy="322" r="4"/>
    <circle cx="422" cy="371" r="4"/>
    <circle cx="395" cy="415" r="4"/>
    <circle cx="356" cy="450" r="4"/>
    <circle cx="308" cy="474" r="4"/>
    <circle cx="256" cy="482" r="5"/>
    <circle cx="204" cy="474" r="4"/>
    <circle cx="156" cy="450" r="4"/>
    <circle cx="117" cy="415" r="4"/>
    <circle cx="90" cy="371" r="4"/>
    <circle cx="76" cy="322" r="4"/>
    <circle cx="76" cy="256" r="5"/>
    <circle cx="76" cy="190" r="4"/>
    <circle cx="90" cy="141" r="4"/>
    <circle cx="117" cy="97" r="4"/>
    <circle cx="156" cy="62" r="4"/>
    <circle cx="204" cy="38" r="4"/>
  </g>
  <!-- Inner background -->
  <circle cx="256" cy="256" r="185" fill="#2d1f6e" opacity="0.5"/>
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)"/>
  <!-- Shield -->
  <g transform="translate(256,256)" filter="url(#glow)">
    <path d="M0,-100 L75,-64 L75,18 Q75,82 0,110 Q-75,82 -75,18 L-75,-64 Z"
          fill="none" stroke="#f59e0b" stroke-width="5"/>
    <path d="M0,-100 L75,-64 L75,18 Q75,82 0,110 Q-75,82 -75,18 L-75,-64 Z"
          fill="#f59e0b" opacity="0.08"/>
    <!-- Checkmark -->
    <path d="M-32,8 L-8,36 L44,-28"
          fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Quill pen -->
    <g transform="translate(18,-15) rotate(-38)">
      <path d="M0,-75 Q-35,-45 8,55 Q-15,5 0,-75" fill="#f59e0b" opacity="0.9"/>
      <path d="M0,-75 Q35,-55 8,55 Q18,5 0,-75" fill="#fcd34d" opacity="0.7"/>
      <path d="M6,52 L10,76 L4,58 Z" fill="#fbbf24"/>
    </g>
  </g>
  <!-- Bottom label -->
  <text x="256" y="438" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" font-weight="bold" letter-spacing="7" fill="#f59e0b" opacity="0.85">AUTORSELO</text>
  <line x1="95" y1="430" x2="148" y2="430" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <line x1="364" y1="430" x2="417" y2="430" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
</svg>
